{% extends "base.html" %}

{% block content %}
<div class="auth-page">
    <div class="auth-bg-animated">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <div class="auth-container" style="width: 100%; display: flex; justify-content: center; padding: 1rem;">
        <div class="auth-card-premium" style="padding: 1.5rem; max-width: 440px;">
            <div class="auth-header-premium">
                <div class="brand-icon-animated">
                    <div class="icon-glow"></div>
                    <i data-lucide="key-round" width="48" height="48"></i>
                </div>
                <h1 class="auth-title-gradient">Reset Password</h1>
                <p class="auth-subtitle-premium">Enter your username and we'll email you a reset link.</p>
            </div>

            <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="auth-form-premium">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group-premium">
                    <label for="username" class="form-label-premium">
                        <i data-lucide="user" width="16" height="16"></i>
                        Username
                    </label>
                    <div class="input-wrapper-premium">
                        <input type="text" id="username" name="username" class="form-input-premium"
                            placeholder="Enter your username" required autofocus>
                        <div class="input-border-glow"></div>
                    </div>
                </div>

                <button type="submit" class="btn-login-premium">
                    <span class="btn-text">Send Reset Link</span>
                    <i data-lucide="arrow-right" width="20" height="20" class="btn-icon"></i>
                </button>
            </form>

            <div class="auth-footer-premium">
                <div class="divider">
                    <span>Remembered it?</span>
                </div>
                <p class="copyright">
                    <a href="{{ url_for('auth.login') }}">Back to Sign In</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
