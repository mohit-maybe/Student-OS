{% extends "base.html" %}

{% block content %}
<div class="auth-page">
    <div class="auth-bg-animated">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <div class="auth-container" style="width: 100%; display: flex; justify-content: center; padding: 1rem;">
        <div class="auth-card-premium" style="padding: 1.5rem; max-width: 440px;">
            <div class="auth-header-premium">
                <div class="brand-icon-animated">
                    <div class="icon-glow"></div>
                    <i data-lucide="lock-keyhole" width="48" height="48"></i>
                </div>
                <h1 class="auth-title-gradient">Set New Password</h1>
                <p class="auth-subtitle-premium">Choose a new password for your account.</p>
            </div>

            <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" class="auth-form-premium">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group-premium">
                    <label for="password" class="form-label-premium">
                        <i data-lucide="lock" width="16" height="16"></i>
                        New Password
                    </label>
                    <div class="input-wrapper-premium">
                        <input type="password" id="password" name="password" class="form-input-premium"
                            placeholder="At least 8 characters" required minlength="8" autofocus>
                        <div class="input-border-glow"></div>
                    </div>
                </div>

                <div class="form-group-premium">
                    <label for="confirm_password" class="form-label-premium">
                        <i data-lucide="lock" width="16" height="16"></i>
                        Confirm Password
                    </label>
                    <div class="input-wrapper-premium">
                        <input type="password" id="confirm_password" name="confirm_password" class="form-input-premium"
                            placeholder="Re-enter new password" required minlength="8">
                        <div class="input-border-glow"></div>
                    </div>
                </div>

                <button type="submit" class="btn-login-premium">
                    <span class="btn-text">Update Password</span>
                    <i data-lucide="arrow-right" width="20" height="20" class="btn-icon"></i>
                </button>
            </form>

            <div class="auth-footer-premium">
                <p class="copyright">
                    <a href="{{ url_for('auth.login') }}">Back to Sign In</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
